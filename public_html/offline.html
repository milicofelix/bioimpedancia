<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#087f98">
    <title>Vita Scan — Sem conexão</title>
    <style>
        :root { color-scheme: light; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
        * { box-sizing: border-box; }
        body { align-items: center; background: linear-gradient(180deg, #f5fafc, #f0fdfa); color: #052f59; display: flex; margin: 0; min-height: 100vh; min-height: 100dvh; padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left)); }
        main { background: #fff; border: 1px solid #b2e5e6; border-radius: 20px; box-shadow: 0 14px 38px rgba(5, 47, 89, .09); margin: auto; max-width: 380px; padding: 28px; text-align: center; width: 100%; }
        img { border-radius: 22px; height: 72px; width: 72px; }
        h1 { font-size: 21px; margin: 20px 0 8px; }
        p { color: #475569; font-size: 14px; line-height: 1.55; margin: 0; }
        button { background: linear-gradient(135deg, #087f98, #052f59); border: 0; border-radius: 12px; color: #fff; cursor: pointer; font: inherit; font-size: 14px; font-weight: 700; margin-top: 22px; min-height: 48px; padding: 12px 18px; width: 100%; }
        button:focus-visible { outline: 3px solid #08667f; outline-offset: 3px; }
    </style>
</head>
<body>
    <main>
        <img src="/pwa/icons/icon-192.png" alt="Vita Scan">
		<p style="color:#08667f;font-size:12px;font-weight:800;letter-spacing:.12em;margin:12px 0 0;text-transform:uppercase">Vita Scan</p>
        <h1>Você está offline</h1>
		<p>As operações clínicas exigem conexão. Por segurança, clientes, avaliações, imagens e relatórios não ficam armazenados para uso offline neste aparelho.</p>
        <button type="button" onclick="window.location.reload()">Tentar novamente</button>
    </main>
</body>
</html>
