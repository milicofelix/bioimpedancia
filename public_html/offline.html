<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#ad3f5b">
    <title>Ricosty — Sem conexão</title>
    <style>
        :root { color-scheme: light; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
        * { box-sizing: border-box; }
        body { align-items: center; background: linear-gradient(180deg, #fffaf6, #fff7f7); color: #38101d; display: flex; margin: 0; min-height: 100vh; min-height: 100dvh; padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left)); }
        main { background: #fff; border: 1px solid #f6d5db; border-radius: 20px; box-shadow: 0 14px 38px rgba(97, 38, 55, .09); margin: auto; max-width: 380px; padding: 28px; text-align: center; width: 100%; }
        img { border-radius: 22px; height: 72px; width: 72px; }
        h1 { font-size: 21px; margin: 20px 0 8px; }
        p { color: #475569; font-size: 14px; line-height: 1.55; margin: 0; }
        button { background: linear-gradient(135deg, #c6536e, #8e3049); border: 0; border-radius: 12px; color: #fff; cursor: pointer; font: inherit; font-size: 14px; font-weight: 700; margin-top: 22px; min-height: 48px; padding: 12px 18px; width: 100%; }
        button:focus-visible { outline: 3px solid #8e3049; outline-offset: 3px; }
    </style>
</head>
<body>
    <main>
        <img src="/pwa/icons/icon-192.png" alt="Ricosty">
        <h1>Você está offline</h1>
        <p>Por segurança, clientes, avaliações, imagens e relatórios não ficam armazenados neste aparelho. Reconecte-se para continuar.</p>
        <button type="button" onclick="window.location.reload()">Tentar novamente</button>
    </main>
</body>
</html>
