<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#d88b9a">
    <title>Ricosty — Sem conexão</title>
    <style>
        :root { color-scheme: light; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
        * { box-sizing: border-box; }
        body { align-items: center; background: #f8fafc; color: #0f172a; display: flex; margin: 0; min-height: 100vh; padding: 24px; }
        main { background: #fff; border: 1px solid #e2e8f0; border-radius: 20px; box-shadow: 0 8px 30px rgba(15, 23, 42, .08); margin: auto; max-width: 380px; padding: 28px; text-align: center; width: 100%; }
        img { border-radius: 22px; height: 72px; width: 72px; }
        h1 { font-size: 21px; margin: 20px 0 8px; }
        p { color: #475569; font-size: 14px; line-height: 1.55; margin: 0; }
        button { background: #0f172a; border: 0; border-radius: 12px; color: #fff; cursor: pointer; font: inherit; font-size: 14px; font-weight: 700; margin-top: 22px; padding: 12px 18px; }
    </style>
</head>
<body>
    <main>
        <img src="/pwa/icons/icon-192.png" alt="Ricosty">
        <h1>Você está sem conexão</h1>
        <p>Por segurança, clientes, avaliações, imagens e relatórios não ficam armazenados neste aparelho. Reconecte-se para continuar.</p>
        <button type="button" onclick="window.location.reload()">Tentar novamente</button>
    </main>
</body>
</html>
